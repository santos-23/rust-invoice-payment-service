[package]
name = "rust-invoice-payment-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
hex = "0.4.3"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = "0.9.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
diesel = { version = "2.2.8", features = ["postgres", "serde_json", "uuid", "chrono", "postgres_backend", "numeric", "network-address", "r2d2"] }
diesel_migrations = "2.1.0"
diesel-async = { version = "0.9", features = [
    "postgres",
    "bb8"
] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }

anyhow = "1.0.104"
